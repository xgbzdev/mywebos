name: Build Firefox OS ISO
on: [workflow_dispatch, push]
jobs:
  iso:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          apt-get update && apt-get install -y sudo
          chmod +x build.sh && ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: firefoxos-iso
          path: |
            firefoxos-amd64.iso
            firefoxos-amd64.iso.sha256
          compression-level: 0
