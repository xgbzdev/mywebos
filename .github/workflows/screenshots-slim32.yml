name: Screenshots Slim 32-bit (512 MB)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/screenshots-slim32.yml'
      - 'tools/shots-slim.py'
  workflow_run:
    workflows: ["Build B2L Slim 32-bit ISO"]
    types: [completed]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 imagemagick xorriso
          sudo chmod 666 /dev/kvm || true
      - name: Get the newest slim ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          TAG=$(gh release list -R "$GITHUB_REPOSITORY" -L 50 --json tagName -q '[.[]|select(.tagName|startswith("slim32-build-"))][0].tagName')
          echo "Using $TAG"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern 'b2l-slim32-i386.iso'
      - name: Startup image size
        continue-on-error: true
        run: |
          set +e
          mkdir -p shots
          xorriso -indev b2l-slim32-i386.iso -ls_l /live > shots/iso-live-folder.txt 2>&1
          xorriso -osirrox on -indev b2l-slim32-i386.iso -extract /live/initrd.img initrd.img > /dev/null 2>&1
          sudo apt-get install -y -qq initramfs-tools-core > /dev/null 2>&1
          if [ -f initrd.img ]; then
            unmkinitramfs initrd.img x > /dev/null 2>&1
            echo "--- unpacked startup image ---" >> shots/iso-live-folder.txt
            du -sh x >> shots/iso-live-folder.txt
            du -sh x/*/usr/lib/* x/usr/lib/* 2>/dev/null | sort -h | tail -n 8 >> shots/iso-live-folder.txt
          fi
          cat shots/iso-live-folder.txt
      - name: Boot with 512 MB and take screenshots
        run: |
          mkdir -p shots
          ACCEL="-enable-kvm -cpu host"; [ -w /dev/kvm ] || ACCEL=""
          echo "accel: $ACCEL" > shots/qemu-accel.txt
          qemu-system-i386 $ACCEL -m 512 -smp 1 -cdrom b2l-slim32-i386.iso -boot d \
            -vga std -display none -usb -device usb-tablet \
            -serial file:$GITHUB_WORKSPACE/shots/serial-memlog.txt -monitor unix:/tmp/qemu-mon,server,nowait -daemonize
          sleep 2
          python3 tools/shots-slim.py shots || echo "screenshot script failed" >> shots/qemu-accel.txt
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete screenshots-slim32 -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          ls shots; gh release create screenshots-slim32 shots/*  -R "$GITHUB_REPOSITORY" --prerelease \
            --title "Screenshots: Slim 32-bit in 512 MB" --notes "Taken automatically in QEMU with 512 MB RAM"
