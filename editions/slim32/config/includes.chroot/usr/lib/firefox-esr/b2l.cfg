// B2L autoconfig (first line must be a comment)
// App-style windows: hide the address bar and tabs ONLY in pop-up windows that
// show B2L's own pages (home screen at 127.0.0.1:8090, apps at <id>.localhost:8090).
// Websites' pop-ups always keep their address bar.
try {
  const Cc = Components.classes, Ci = Components.interfaces;
  const io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
  const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  const css = '@-moz-document url("chrome://browser/content/browser.xhtml") {' +
    ':root[b2l-app] #nav-bar, :root[b2l-app] #TabsToolbar, :root[b2l-app] #PersonalToolbar,' +
    ':root[b2l-app] #notifications-toolbar { visibility: collapse !important; } }';
  sss.loadAndRegisterSheet(io.newURI("data:text/css;charset=utf-8," + encodeURIComponent(css)), sss.AGENT_SHEET);

  const isB2L = function (uri) {
    try {
      return uri && uri.scheme === "http" && uri.port === 8090 &&
        (uri.host === "127.0.0.1" || /^[a-z0-9-]+\.localhost$/.test(uri.host));
    } catch (e) { return false; }
  };
  const watch = function (win) {
    if (!win.gBrowser) { return; }
    const root = win.document.documentElement;
    const update = function (uri) {
      if (root.hasAttribute("chromehidden") && isB2L(uri)) { root.setAttribute("b2l-app", "true"); }
      else { root.removeAttribute("b2l-app"); }
    };
    update(win.gBrowser.currentURI);
    win.gBrowser.addProgressListener({
      QueryInterface: ChromeUtils.generateQI(["nsIWebProgressListener", "nsISupportsWeakReference"]),
      onLocationChange: function (wp, req, loc) { update(loc); }
    });
  };
  const obs = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
  obs.addObserver({ observe: function (subject) { watch(subject); } }, "browser-delayed-startup-finished");
} catch (e) {
  Components.utils.reportError("B2L autoconfig: " + e);
}
