name: Screenshots
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Firefox OS ISO"]
    types: [completed]
  push:
    paths:
      - '.github/workflows/screenshots.yml'
      - 'tools/shots.py'
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils imagemagick
          sudo chmod 666 /dev/kvm || true
      - name: Get slim ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60   # let the publish job finish
          gh release download -R "$GITHUB_REPOSITORY" --pattern 'firefoxos-amd64.iso.part*' --dir iso
          cat iso/firefoxos-amd64.iso.part* > slim.iso && ls -la slim.iso
      - name: Boot and take screenshots
        run: |
          ACCEL="-enable-kvm -cpu host"; [ -w /dev/kvm ] || ACCEL=""
          qemu-system-x86_64 $ACCEL -m 2048 -smp 2 -cdrom slim.iso -boot d \
            -vga std -display none -usb -device usb-tablet \
            -monitor unix:/tmp/qemu-mon,server,nowait -daemonize
          sleep 2
          python3 tools/shots.py shots
          ls -la shots
      - name: Publish screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete screenshots -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create screenshots shots/*.png -R "$GITHUB_REPOSITORY" --prerelease \
            --title "Screenshots of the slim edition" --notes "Taken automatically in QEMU"
